; BtCarKey box simulator for a classic ESP32 dev board (ESP32-WROOM/-WROVER, e.g. "ESP32 DevKit").
; Build:  pio run          Flash: .\flash.ps1  (or pio run -t upload)
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1

; Two OTA slots: the running simulator can rewrite the other slot with a new build received
; over the serial console, which is how flash.ps1 updates boards without an auto-reset circuit.
board_build.partitions = partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Onboard LED blinked on car actions (GPIO2 on most DevKits); -1 disables it
    -DSIM_LED_PIN=2

; esptool enters the ROM bootloader via the DTR/RTS auto-reset circuit and reboots into the app after
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset
upload_speed = 921600

monitor_speed = 115200
; Keep DTR/RTS released, otherwise opening the monitor can hold the chip in reset
monitor_rts = 0
monitor_dtr = 0
monitor_filters = direct
